<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Particles - No Camera</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: Arial; overflow: hidden; }
    #info { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 8px; z-index: 100; }
    #controls { position: fixed; left: 10px; top: 120px; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 8px; width: 280px; }
    h2 { margin: 0 0 15px 0; font-size: 18px; color: #667eea; }
    h3 { margin: 15px 0 10px 0; font-size: 13px; color: #888; text-transform: uppercase; }
    button { margin: 5px; padding: 12px 15px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 13px; transition: all 0.2s; }
    button:hover { background: #5568d3; transform: translateY(-2px); }
    button.active { background: #ff69b4; box-shadow: 0 0 15px #ff69b4; }
    input[type="color"] { width: 100%; height: 45px; border: none; border-radius: 8px; cursor: pointer; }
    input[type="range"] { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; outline: none; }
    .value { text-align: center; margin-top: 8px; font-size: 14px; color: #fff; }
    #title { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 42px; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; pointer-events: none; z-index: 50; }
    .note { font-size: 11px; color: #888; margin-top: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="title">3D Particle System</div>

  <div id="info">
    <div style="font-size:16px;font-weight:bold;color:#0f0;">✅ NO CAMERA NEEDED</div>
    <div style="font-size:12px;margin-top:8px;color:#888;">Mouse control only</div>
  </div>

  <div id="controls">
    <h2>🎨 Particle Templates</h2>
    <button onclick="setShape('heart')" class="active" id="heart">❤️ Heart</button>
    <button onclick="setShape('flower')" id="flower">🌸 Flower</button>
    <button onclick="setShape('saturn')" id="saturn">🪐 Saturn</button>
    <button onclick="setShape('buddha')" id="buddha">🧘 Buddha</button>
    <button onclick="setShape('fireworks')" id="fireworks">🎆 Fireworks</button>

    <h3>🎨 Color</h3>
    <input type="color" value="#ff69b4" onchange="setColor(this.value)">

    <h3>⚙️ Particle Count</h3>
    <input type="range" min="500" max="5000" step="100" value="2000" oninput="setCount(this.value)">
    <div class="value"><span id="count">2000</span> particles</div>

    <div class="note">
      <strong>Controls:</strong><br>
      • Mouse UP/DOWN: Scale particles<br>
      • Mouse LEFT/RIGHT: Rotate speed<br>
      • Click templates to change shape
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, particles, shape = 'heart', color = 0xff69b4, count = 2000;
    let mouseY = 0, mouseX = 0, targetScale = 1, currentScale = 1;

    const shapes = {
      heart: (n) => {
        const p = [];
        for(let i = 0; i < n; i++) {
          const t = (i/n) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3) * 0.3;
          const y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * 0.3;
          p.push(x, y, (Math.random()-0.5)*5);
        }
        return new Float32Array(p);
      },
      flower: (n) => {
        const p = [];
        for(let i = 0; i < n; i++) {
          const a = (i/n) * Math.PI * 2;
          const r = 5 * (1 + 0.5 * Math.sin(8 * a));
          p.push(r*Math.cos(a), r*Math.sin(a), (Math.random()-0.5)*3);
        }
        return new Float32Array(p);
      },
      saturn: (n) => {
        const p = [];
        for(let i = 0; i < n*0.6; i++) {
          const t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = 4+Math.random();
          p.push(r*Math.sin(ph)*Math.cos(t), r*Math.sin(ph)*Math.sin(t), r*Math.cos(ph));
        }
        for(let i = 0; i < n*0.4; i++) {
          const a = Math.random()*Math.PI*2, r = 6+Math.random()*3;
          p.push(r*Math.cos(a), (Math.random()-0.5)*0.5, r*Math.sin(a));
        }
        return new Float32Array(p);
      },
      buddha: (n) => {
        const p = [];
        for(let i = 0; i < n; i++) {
          const y = (i/n)*12-6;
          let r = y<-4 ? 4+Math.sin((y+4)*0.5)*2 : y<2 ? 3.5-Math.abs(y)*0.2 : 2.5-(y-2)*0.3;
          const a = Math.random()*Math.PI*2, rad = r*Math.random();
          p.push(rad*Math.cos(a), y, rad*Math.sin(a));
        }
        return new Float32Array(p);
      },
      fireworks: (n) => {
        const p = [];
        for(let e = 0; e < 5; e++) {
          const cx = (Math.random()-0.5)*15, cy = (Math.random()-0.5)*15, cz = (Math.random()-0.5)*15;
          for(let i = 0; i < n/5; i++) {
            const t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = Math.random()*3;
            p.push(cx+r*Math.sin(ph)*Math.cos(t), cy+r*Math.sin(ph)*Math.sin(t), cz+r*Math.cos(ph));
          }
        }
        return new Float32Array(p);
      }
    };

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 30;

      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x0a0a0a);
      document.body.appendChild(renderer.domElement);

      makeParticles();
      animate();

      window.onresize = () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };

      document.onmousemove = (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        targetScale = 0.5 + (mouseY + 1) * 1.5;
        targetScale = Math.max(0.3, Math.min(4, targetScale));
      };
    }

    function makeParticles() {
      if(particles) scene.remove(particles);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(shapes[shape](count), 3));
      const mat = new THREE.PointsMaterial({
        color: color,
        size: 0.15,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function animate() {
      requestAnimationFrame(animate);

      currentScale += (targetScale - currentScale) * 0.1;

      if(particles) {
        particles.rotation.y += 0.002 + mouseX * 0.003;
        particles.rotation.x += 0.001;
        particles.scale.setScalar(currentScale);
      }
      renderer.render(scene, camera);
    }

    window.setShape = (s) => {
      shape = s;
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      document.getElementById(s).classList.add('active');
      makeParticles();
    };

    window.setColor = (c) => {
      color = parseInt(c.replace('#','0x'));
      if(particles) particles.material.color.setHex(color);
    };

    window.setCount = (c) => {
      count = parseInt(c);
      document.getElementById('count').textContent = c;
      makeParticles();
    };

    init();
  </script>
</body>
</html>
