<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Particles - Hand Control</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: Arial; overflow: hidden; }
    #info { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 100; font-size: 14px; }
    #controls { position: fixed; left: 10px; top: 100px; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 8px; width: 280px; max-height: 80vh; overflow-y: auto; }
    button { margin: 5px; padding: 12px 15px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 13px; }
    button:hover { background: #5568d3; }
    button.active { background: #ff69b4; box-shadow: 0 0 10px #ff69b4; }
    input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 5px; cursor: pointer; }
    input[type="range"] { width: 100%; }
    h3 { margin: 15px 0 10px 0; font-size: 13px; color: #888; text-transform: uppercase; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f00; margin-left: 10px; }
    .dot.on { background: #0f0; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    #msg { margin-top: 10px; font-size: 12px; color: #ff0; }
  </style>
</head>
<body>
  <div id="info">
    <div>🎥 Camera: <span id="cam">Starting...</span><span class="dot" id="dot1"></span></div>
    <div>✋ Hands: <span id="hands">0</span><span class="dot" id="dot2"></span></div>
    <div>📏 Scale: <span id="scale">1.00</span>x</div>
    <div id="msg"></div>
  </div>

  <div id="controls">
    <h2 style="margin-top:0;font-size:16px;">🎨 Templates</h2>
    <button onclick="setTemplate('heart')" class="active" id="btn-heart">❤️ Heart</button>
    <button onclick="setTemplate('flower')" id="btn-flower">🌸 Flower</button>
    <button onclick="setTemplate('saturn')" id="btn-saturn">🪐 Saturn</button>
    <button onclick="setTemplate('buddha')" id="btn-buddha">🧘 Buddha</button>
    <button onclick="setTemplate('fireworks')" id="btn-fireworks">🎆 Fireworks</button>

    <h3>🎨 Color</h3>
    <input type="color" value="#ff69b4" onchange="setColor(this.value)">

    <h3>⚙️ Particles</h3>
    <input type="range" min="500" max="5000" step="100" value="2000" oninput="setCount(this.value)">
    <div style="text-align:center;margin-top:5px;"><span id="count">2000</span> particles</div>

    <h3 style="margin-top:25px;">ℹ️ Controls</h3>
    <div style="font-size:12px;line-height:1.7;color:#aaa;">
      <b style="color:#667eea;">1 Hand:</b> Open/close fist<br>
      <b style="color:#667eea;">2 Hands:</b> Move apart/together<br>
      <br>
      <span style="font-size:11px;opacity:0.7;">Particles auto-rotate. Hand gestures control scale.</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
  <script>
    let scene, camera, renderer, particles, template = 'heart', color = 0xff69b4, count = 2000;
    let targetScale = 1, currentScale = 1;
    let handTracking = false;

    const templates = {
      heart: n => {
        const p = [];
        for(let i = 0; i < n; i++) {
          const t = (i/n) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3) * 0.3;
          const y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * 0.3;
          const z = (Math.random() - 0.5) * 5;
          p.push(x, y, z);
        }
        return new Float32Array(p);
      },
      flower: n => {
        const p = [];
        for(let i = 0; i < n; i++) {
          const a = (i/n) * Math.PI * 2;
          const r = 5 * (1 + 0.5 * Math.sin(8 * a));
          p.push(r * Math.cos(a), r * Math.sin(a), (Math.random()-0.5)*3);
        }
        return new Float32Array(p);
      },
      saturn: n => {
        const p = [];
        for(let i = 0; i < n*0.6; i++) {
          const t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = 4+Math.random();
          p.push(r*Math.sin(ph)*Math.cos(t), r*Math.sin(ph)*Math.sin(t), r*Math.cos(ph));
        }
        for(let i = 0; i < n*0.4; i++) {
          const a = Math.random()*Math.PI*2, r = 6+Math.random()*3;
          p.push(r*Math.cos(a), (Math.random()-0.5)*0.5, r*Math.sin(a));
        }
        return new Float32Array(p);
      },
      buddha: n => {
        const p = [];
        for(let i = 0; i < n; i++) {
          const y = (i/n)*12-6;
          let r = y<-4 ? 4+Math.sin((y+4)*0.5)*2 : y<2 ? 3.5-Math.abs(y)*0.2 : 2.5-(y-2)*0.3;
          const a = Math.random()*Math.PI*2, rad = r*Math.random();
          p.push(rad*Math.cos(a), y, rad*Math.sin(a));
        }
        return new Float32Array(p);
      },
      fireworks: n => {
        const p = [];
        for(let e = 0; e < 5; e++) {
          const cx = (Math.random()-0.5)*15, cy = (Math.random()-0.5)*15, cz = (Math.random()-0.5)*15;
          for(let i = 0; i < n/5; i++) {
            const t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = Math.random()*3;
            p.push(cx+r*Math.sin(ph)*Math.cos(t), cy+r*Math.sin(ph)*Math.sin(t), cz+r*Math.cos(ph));
          }
        }
        return new Float32Array(p);
      }
    };

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
      camera.position.z = 30;
      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(innerWidth, innerHeight);
      renderer.setClearColor(0x0a0a0a);
      document.body.appendChild(renderer.domElement);
      createParticles();
      animate();
      window.onresize = () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      };

      document.getElementById('dot1').classList.add('on');
      document.getElementById('cam').textContent = 'Active';
      document.getElementById('msg').textContent = 'Move your hand to test!';

      initHandTracking();
    }

    function createParticles() {
      if(particles) scene.remove(particles);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(templates[template](count), 3));
      const mat = new THREE.PointsMaterial({color, size:0.15, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending});
      particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function animate() {
      requestAnimationFrame(animate);
      currentScale += (targetScale - currentScale) * 0.1;
      if(particles) {
        particles.rotation.y += 0.002;
        particles.rotation.x += 0.001;
        particles.scale.setScalar(currentScale);
      }
      renderer.render(scene, camera);
    }

    async function initHandTracking() {
      try {
        // Load MediaPipe dynamically
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
        script.onload = async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;

            const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});
            hands.setOptions({maxNumHands:2, modelComplexity:0, minDetectionConfidence:0.5, minTrackingConfidence:0.5});

            hands.onResults(results => {
              const n = results.multiHandLandmarks?.length || 0;
              document.getElementById('hands').textContent = n;

              if(n > 0 && !handTracking) {
                handTracking = true;
                document.getElementById('dot2').classList.add('on');
                document.getElementById('msg').textContent = 'Hand tracking active! ✅';
              }

              if(n === 1) {
                const open = calcOpen(results.multiHandLandmarks[0]);
                targetScale = 0.5 + open * 1.5;
              } else if(n === 2) {
                const dist = calcDist(results.multiHandLandmarks[0], results.multiHandLandmarks[1]);
                const o1 = calcOpen(results.multiHandLandmarks[0]);
                const o2 = calcOpen(results.multiHandLandmarks[1]);
                targetScale = Math.max(0.3, Math.min(4, (0.5 + dist*3) * (0.5 + (o1+o2)/4)));
              } else {
                targetScale = 1;
              }
              document.getElementById('scale').textContent = targetScale.toFixed(2);
            });

            async function process() {
              if(video.readyState === 4) await hands.send({image:video});
              requestAnimationFrame(process);
            }
            video.onloadeddata = process;

          } catch(err) {
            document.getElementById('cam').textContent = 'Blocked';
            document.getElementById('msg').innerHTML = '<span style="color:#f00;">Camera blocked! Click address bar camera icon to allow.</span>';
          }
        };
        document.head.appendChild(script);
      } catch(err) {
        console.error(err);
      }
    }

    function calcOpen(lm) {
      if(!lm || lm.length < 21) return 0;
      let total = 0, base = 0;
      [8,12,16,20].forEach((tip,i) => {
        const b = [5,9,13,17][i];
        total += Math.hypot(lm[tip].x-lm[0].x, lm[tip].y-lm[0].y, lm[tip].z-lm[0].z);
        base += Math.hypot(lm[b].x-lm[0].x, lm[b].y-lm[0].y, lm[b].z-lm[0].z);
      });
      return Math.min(1, total/(base*1.5));
    }

    function calcDist(h1, h2) {
      return Math.hypot(h1[9].x-h2[9].x, h1[9].y-h2[9].y, h1[9].z-h2[9].z);
    }

    function setTemplate(t) {
      template = t;
      document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-'+t).classList.add('active');
      createParticles();
    }

    function setColor(c) {
      color = parseInt(c.replace('#','0x'));
      if(particles) particles.material.color.setHex(color);
    }

    function setCount(c) {
      count = parseInt(c);
      document.getElementById('count').textContent = c;
      createParticles();
    }

    window.onload = init;
  </script>
</body>
</html>
