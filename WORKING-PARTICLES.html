<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Particles Working</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: Arial; }
    #info { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 100; }
    button { margin: 5px; padding: 10px 15px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 5px; }
    button.active { background: #ff69b4; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <div style="font-size:20px;margin-bottom:10px;">✅ PARTICLES WORKING!</div>
    <button onclick="setShape('heart')" class="active" id="heart">❤️ Heart</button>
    <button onclick="setShape('flower')" id="flower">🌸 Flower</button>
    <button onclick="setShape('saturn')" id="saturn">🪐 Saturn</button>
    <br>
    <input type="color" value="#ff69b4" onchange="setColor(this.value)" style="width:100%;margin-top:10px;height:40px;">
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer, particles, shape = 'heart', color = 0xff69b4;

    const shapes = {
      heart: () => {
        const p = [];
        for(let i = 0; i < 2000; i++) {
          const t = (i/2000) * Math.PI * 2;
          const x = 16 * Math.pow(Math.sin(t), 3) * 0.3;
          const y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * 0.3;
          p.push(x, y, (Math.random()-0.5)*5);
        }
        return new Float32Array(p);
      },
      flower: () => {
        const p = [];
        for(let i = 0; i < 2000; i++) {
          const a = (i/2000) * Math.PI * 2;
          const r = 5 * (1 + 0.5 * Math.sin(8 * a));
          p.push(r*Math.cos(a), r*Math.sin(a), (Math.random()-0.5)*3);
        }
        return new Float32Array(p);
      },
      saturn: () => {
        const p = [];
        for(let i = 0; i < 1200; i++) {
          const t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = 4+Math.random();
          p.push(r*Math.sin(ph)*Math.cos(t), r*Math.sin(ph)*Math.sin(t), r*Math.cos(ph));
        }
        for(let i = 0; i < 800; i++) {
          const a = Math.random()*Math.PI*2, r = 6+Math.random()*3;
          p.push(r*Math.cos(a), (Math.random()-0.5)*0.5, r*Math.sin(a));
        }
        return new Float32Array(p);
      }
    };

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 30;

      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x0a0a0a);
      document.body.appendChild(renderer.domElement);

      makeParticles();
      animate();

      window.onresize = () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };
    }

    function makeParticles() {
      if(particles) scene.remove(particles);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(shapes[shape](), 3));
      const mat = new THREE.PointsMaterial({
        color: color,
        size: 0.15,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      particles = new THREE.Points(geo, mat);
      scene.add(particles);
    }

    function animate() {
      requestAnimationFrame(animate);
      if(particles) {
        particles.rotation.y += 0.003;
        particles.rotation.x += 0.001;
      }
      renderer.render(scene, camera);
    }

    window.setShape = (s) => {
      shape = s;
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      document.getElementById(s).classList.add('active');
      makeParticles();
    };

    window.setColor = (c) => {
      color = parseInt(c.replace('#','0x'));
      if(particles) particles.material.color.setHex(color);
    };

    init();
  </script>
</body>
</html>
